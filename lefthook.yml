# Centralized Enterprise Lefthook Configuration for FoodShare Ecosystem
# Shared across foodshare-web, foodshare-backend, foodshare-app, and foodshare-tools via symlinks.

pre-commit:
  parallel: false
  commands:
    # -------------------------------------------------------------------------
    # 1. CYBERSECURITY CHECKERS (Priority 1 - OWASP Secrets, API Keys, Web Vulnerabilities)
    # -------------------------------------------------------------------------
    security-secrets:
      priority: 1
      run: |
        REPO_ROOT="$(git rev-parse --show-toplevel)"
        HOOKS_BIN="${FOODSHARE_HOOKS_BIN:-$REPO_ROOT/../foodshare-tools/target/release/lefthook-rs}"
        [ ! -f "$HOOKS_BIN" ] && HOOKS_BIN="${FOODSHARE_HOOKS_BIN:-$REPO_ROOT/../foodshare-tools/target/debug/lefthook-rs}"
        if [ -f "$HOOKS_BIN" ]; then
          "$HOOKS_BIN" security {staged_files}
        fi

    web-cybersecurity:
      priority: 1
      glob: "*.{ts,tsx,js,jsx}"
      run: |
        REPO_ROOT="$(git rev-parse --show-toplevel)"
        HOOKS_BIN="${FOODSHARE_HOOKS_BIN:-$REPO_ROOT/../foodshare-tools/target/release/lefthook-rs}"
        [ ! -f "$HOOKS_BIN" ] && HOOKS_BIN="${FOODSHARE_HOOKS_BIN:-$REPO_ROOT/../foodshare-tools/target/debug/lefthook-rs}"
        if [ -f "$HOOKS_BIN" ]; then
          "$HOOKS_BIN" nextjs-security {staged_files}
        fi

    backend-cybersecurity:
      priority: 1
      glob: "supabase/functions/**/*.ts"
      run: |
        if command -v deno >/dev/null 2>&1; then
          deno lint {staged_files}
        fi

    # -------------------------------------------------------------------------
    # 2. TYPECHECKERS & STAGED TESTS (Priority 2)
    # -------------------------------------------------------------------------
    web-staged-tests:
      priority: 2
      glob: "src/__tests__/**/*.test.{ts,tsx}"
      run: |
        if [ -f package.json ]; then
          bun test {staged_files}
        fi

    web-action-tests:
      priority: 2
      glob: "src/app/actions/**/*.ts"
      run: |
        if [ -f package.json ] && [ -d src/__tests__/actions ]; then
          bun test src/__tests__/actions/
        fi

    web-lib-tests:
      priority: 2
      glob: "src/lib/**/*.ts"
      run: |
        if [ -f package.json ] && [ -d src/__tests__/lib ]; then
          bun test src/__tests__/lib/
        fi

    backend-staged-tests:
      priority: 2
      glob: "supabase/functions/**/*.ts"
      run: |
        if command -v deno >/dev/null 2>&1 && [ -d supabase/functions ]; then
          deno test --allow-env --allow-net supabase/functions/ 2>/dev/null || true
        fi

    web-type-check:
      priority: 2
      run: |
        if [ -f tsconfig.json ]; then
          bunx tsc --noEmit
        fi

    backend-type-check:
      priority: 2
      glob: "supabase/functions/**/*.ts"
      run: |
        if command -v deno >/dev/null 2>&1 && [ -f supabase/functions/deno.json ]; then
          deno check {staged_files}
        fi

    mobile-type-check:
      priority: 2
      glob: "**/*.swift"
      run: |
        if command -v swiftformat >/dev/null 2>&1; then
          swiftformat --lint {staged_files}
        fi

    tools-type-check:
      priority: 2
      glob: "**/*.rs"
      run: |
        if [ -f Cargo.toml ] && command -v cargo >/dev/null 2>&1; then
          cargo check --workspace
        fi

    web-accessibility:
      priority: 2
      glob: "*.{tsx,jsx}"
      run: |
        REPO_ROOT="$(git rev-parse --show-toplevel)"
        HOOKS_BIN="${FOODSHARE_HOOKS_BIN:-$REPO_ROOT/../foodshare-tools/target/release/lefthook-rs}"
        [ ! -f "$HOOKS_BIN" ] && HOOKS_BIN="${FOODSHARE_HOOKS_BIN:-$REPO_ROOT/../foodshare-tools/target/debug/lefthook-rs}"
        if [ -f "$HOOKS_BIN" ]; then
          "$HOOKS_BIN" accessibility {staged_files}
        fi

    workflow-yaml-check:
      priority: 1
      glob: ".github/workflows/*.{yml,yaml}"
      run: |
        bunx js-yaml {staged_files} > /dev/null

    # -------------------------------------------------------------------------
    # 3. LINTING & FORMATTING (Priority 3 - Mandated Toolchain: Oxlint, Biome, Prettier)
    # -------------------------------------------------------------------------
    web-oxlint:
      priority: 3
      glob: "*.{ts,tsx,js,jsx}"
      run: |
        if [ -f package.json ]; then
          bunx oxlint --fix {staged_files}
        fi
      stage_fixed: true

    web-biome:
      priority: 3
      glob: "*.{ts,tsx,js,jsx,json}"
      run: |
        if [ -f package.json ]; then
          bunx biome check --write {staged_files} 2>/dev/null || true
        fi
      stage_fixed: true

    web-format:
      priority: 3
      glob: "*.{ts,tsx,js,jsx,json,css,scss,md,yaml,yml}"
      run: |
        if [ -f bun.lockb ] || [ -f bun.lock ]; then
          bunx prettier --write --cache --cache-strategy metadata {staged_files}
        fi
      stage_fixed: true

    backend-format:
      priority: 3
      glob: "supabase/functions/**/*.ts"
      run: |
        if command -v deno >/dev/null 2>&1; then
          deno fmt {staged_files}
        fi
      stage_fixed: true

    mobile-format:
      priority: 3
      glob: "**/*.swift"
      run: |
        if command -v swiftformat >/dev/null 2>&1; then
          swiftformat {staged_files}
        fi
      stage_fixed: true

commit-msg:
  commands:
    conventional-commit:
      run: |
        REPO_ROOT="$(git rev-parse --show-toplevel)"
        HOOKS_BIN="${FOODSHARE_HOOKS_BIN:-$REPO_ROOT/../foodshare-tools/target/release/lefthook-rs}"
        [ ! -f "$HOOKS_BIN" ] && HOOKS_BIN="${FOODSHARE_HOOKS_BIN:-$REPO_ROOT/../foodshare-tools/target/debug/lefthook-rs}"
        if [ -f "$HOOKS_BIN" ]; then
          "$HOOKS_BIN" conventional-commit {1}
        fi

pre-push:
  parallel: false
  commands:
    # -------------------------------------------------------------------------
    # 1. UNIT TEST SUITE & DOMAIN VALIDATION (Priority 1)
    # -------------------------------------------------------------------------
    web-build-check:
      priority: 1
      run: |
        if [ -f package.json ] && [ -f next.config.ts -o -f next.config.js -o -f next.config.mjs ]; then
          echo "🏗️ Verifying Next.js Turbopack build compilation before push..."
          bun run build
        fi

    web-unit-tests:
      priority: 1
      run: |
        if [ -f package.json ] && [ -d src/__tests__ ]; then
          echo "🧪 Running fast unit test suite before push..."
          bun test src/__tests__/actions/auth.test.ts src/__tests__/actions/email.test.ts src/__tests__/actions/newsletter.test.ts src/__tests__/actions/products.test.ts src/__tests__/lib/ src/store/ src/utils/ src/api/ src/lib/logger/ src/lib/testing/
        fi

    web-type-check-full:
      priority: 1
      run: |
        if [ -f tsconfig.json ]; then
          echo "🔍 Verifying Web TypeScript types before push..."
          bunx tsc --noEmit
        fi

    web-oxlint-full:
      priority: 1
      run: |
        if [ -f package.json ] && [ -d src ]; then
          echo "⚡ Verifying Oxlint zero-warning baseline before push..."
          bunx oxlint src/
        fi

    web-biome-full:
      priority: 1
      run: |
        if [ -f package.json ] && [ -d src ]; then
          echo "🎨 Verifying Biome linting and formatting before push..."
          bunx biome check src/
        fi

    i18n-sync-check:
      priority: 1
      run: |
        if [ -f package.json ] && grep -q "translations:sync" package.json; then
          echo "🌐 Verifying i18n translation keys synchronization..."
          bun run translations:sync || true
        fi

    supabase-secret-check:
      priority: 1
      glob: "*.{ts,tsx,js,jsx,json,yml,yaml,env}"
      run: |
        if grep -qE "service_role_key|SUPABASE_SERVICE_ROLE_KEY=ey" {staged_files} 2>/dev/null; then
          echo "🚨 CRITICAL: Potential Supabase Service Role Key leak detected in staged files!"
          exit 1
        fi

    backend-deno-lint-full:
      priority: 1
      run: |
        if command -v deno >/dev/null 2>&1 && [ -d supabase/functions ]; then
          echo "🦕 Verifying Deno Edge Function linting before push..."
          deno lint supabase/functions/
        fi

    backend-type-check-full:
      priority: 1
      run: |
        if command -v deno >/dev/null 2>&1 && [ -d supabase/functions ]; then
          echo "⚡ Verifying Deno Edge Function types before push..."
          for f in supabase/functions/*/index.ts; do
            [ -f "$f" ] && deno check "$f"
          done
        fi

    backend-unit-tests:
      priority: 1
      run: |
        if command -v deno >/dev/null 2>&1 && [ -d supabase/functions ]; then
          echo "🧪 Running Deno Edge Function unit tests before push..."
          deno test --allow-env --allow-net supabase/functions/
        fi

    # -------------------------------------------------------------------------
    # 2. PACKAGE SECURITY AUDIT & PACKAGE UPDATE CHECKERS (Priority 2)
    # -------------------------------------------------------------------------
    package-security-audit:
      priority: 2
      run: |
        if [ -f bun.lockb ] || [ -f bun.lock ]; then
          echo "🛡️ Running package cybersecurity audit..."
          bun audit || echo "⚠️ Package security warnings found."
        fi

    package-update-check:
      priority: 2
      run: |
        if [ -f package.json ]; then
          echo "📦 Checking package updates across domain..."
          bun outdated || true
        fi

    protected-branch:
      priority: 2
      run: |
        REPO_ROOT="$(git rev-parse --show-toplevel)"
        HOOKS_BIN="${FOODSHARE_HOOKS_BIN:-$REPO_ROOT/../foodshare-tools/target/release/lefthook-rs}"
        [ ! -f "$HOOKS_BIN" ] && HOOKS_BIN="${FOODSHARE_HOOKS_BIN:-$REPO_ROOT/../foodshare-tools/target/debug/lefthook-rs}"
        if [ -f "$HOOKS_BIN" ]; then
          "$HOOKS_BIN" protected-branch
        fi

    large-files:
      priority: 2
      run: |
        REPO_ROOT="$(git rev-parse --show-toplevel)"
        HOOKS_BIN="${FOODSHARE_HOOKS_BIN:-$REPO_ROOT/../foodshare-tools/target/release/lefthook-rs}"
        [ ! -f "$HOOKS_BIN" ] && HOOKS_BIN="${FOODSHARE_HOOKS_BIN:-$REPO_ROOT/../foodshare-tools/target/debug/lefthook-rs}"
        if [ -f "$HOOKS_BIN" ]; then
          "$HOOKS_BIN" large-files --max-size 1024
        fi

# Maintenance & Package Update Awareness
post-checkout:
  commands:
    env-awareness:
      run: |
        if git diff --name-only {1} {2} 2>/dev/null | grep -qE "^\.env"; then
          echo "⚠️  Environment files may have changed. Review .env or .env.functions"
        fi
    package-update-awareness:
      run: |
        if git diff --name-only {1} {2} 2>/dev/null | grep -qE "^(package.json|bun.lockb|bun.lock|deno.json|Package.swift|Cargo.lock)$"; then
          echo "📦 Dependencies changed! Consider running package manager update/install (e.g. bun install, deno cache)."
        fi

post-merge:
  commands:
    env-awareness:
      run: |
        if git diff-tree -r --name-only --no-commit-id HEAD@{1} HEAD | grep -qE "^\.env"; then
          echo "⚠️  Environment files changed. Review .env or .env.functions"
        fi
    package-update-awareness:
      run: |
        if git diff-tree -r --name-only --no-commit-id HEAD@{1} HEAD | grep -qE "^(package.json|bun.lockb|bun.lock|deno.json|Package.swift|Cargo.lock)$"; then
          echo "📦 Dependencies changed! Consider running package manager update/install."
        fi
