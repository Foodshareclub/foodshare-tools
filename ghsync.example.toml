# ghsync configuration.
#
# Copy to ~/.config/ghsync/config.toml, set the token, then run
# `ghsync setup` once: it discovers and writes back the project id, the
# single-select option ids, and the per-repo discussion flags into this
# file (atomically, preserving the token).

board = "foodshare"
org = "Foodshareclub"
api = "https://api.github.com"

# Fine-grained PAT, org Foodshareclub, all repos: Issues + Projects RW,
# Discussions RW, Pull requests read; 90-day expiry.
token = "REPLACE_WITH_FINE_GRAINED_PAT"

# The cursor: the only on-disk state. Last-written project field values
# per linked issue, used for change detection (steady state = zero writes).
state_path = "~/.config/ghsync/state.json"

# Kanban assignee for intake cards without a named profile.
default_assignee = "default"

# Agent profiles the intake form may name. An unknown profile fails the
# intake with a loud error naming this list. Must cover the form's
# "Agent profile" options (agent-intake.yml).
profiles = [
  "default",
  "architect",
  "reviewer",
  "security",
  "verifier",
]

# Repos ghsync manage. The two `discussions_*` flags are written by
# `ghsync setup`; absent (or false) means the feed and discussion
# intake skip the repo and log the skip. `feed_category` (default
# "General") names a PRE-EXISTING discussion category the feed posts
# into — categories cannot be created via the API, and `setup` fails
# loudly with the available list if the configured one is missing.
# `default_milestone` is the org-wide monthly readiness milestone
# (month-bound: the operator re-points it when the month rolls).
[[repos]]
name = "foodshare-app"
default_milestone = "Prod Readiness — 2026-11"

[[repos]]
name = "foodshare-backend"
default_milestone = "Prod Readiness — 2026-11"

[[repos]]
name = "foodshare-web"
default_milestone = "Prod Readiness — 2026-11"
feed_category = "General"

[[repos]]
name = "foodshare-tools"
default_milestone = "Prod Readiness — 2026-11"

[project]
# Org Project v2 board (title: "Foodshare Board").
number = 1
# Written back by `ghsync setup`; empty until it has run.
project_id = ""
status_field = "Status"
assignee_field = "Agent"
phase_field = "Phase"

# Project option label -> kanban status.
[project.status_options]
"Backlog" = "todo"
"In progress" = "running"
"Blocked" = "blocked"
"Done" = "done"

# Project option label -> phase slug.
[project.phase_options]
"Backlog" = "backlog"
"In progress" = "in-progress"
"Done" = "done"

# Project option label -> agent profile. Covers the board's agent
# profiles + human, so no assignee write is skipped for an unmapped
# profile (an unmapped one surfaces as unknown-assignee drift).
[project.assignee_options]
"agent-default" = "default"
"agent-architect" = "architect"
"agent-reviewer" = "reviewer"
"agent-security" = "security"
"agent-verifier" = "verifier"
"human" = "human"

# Written back by `ghsync setup`; empty until it has run.
[project.status_option_ids]

[project.phase_option_ids]
