# Bun configuration for FoodShare Tools
# https://bun.sh/docs/runtime/bunfig
#
# Bun is the only runtime in this project's toolchain. Node.js is not
# installed and must not be required:
#
#   - Package management  → bun install
#   - Script execution     → bun run <script>
#   - TypeScript execution → bun <script>.ts   (Bun runs TypeScript natively)
#   - Test runner          → bun test
#   - Workspace commands   → bun run --filter '<pkg>' <script>
#
# Why `[run] bun = true` matters, and why it is not optional:
#
# `bun run <binary>` resolves `node_modules/.bin/<binary>` and executes it.
# By default Bun honours the shebang at the top of that file, and every
# JavaScript CLI in the ecosystem ships `#!/usr/bin/env node`. That hands the
# process to Node — which is not installed here, so the command dies with
# "command not found" (or, worse, silently runs on a different runtime than
# the one the rest of the project assumes).
#
# This setting makes Bun execute those files on its own runtime regardless of
# the shebang.
#
# `bunx` is NOT covered by this setting: `bunx` resolves the package's own
# shebang instead. Use `bunx --bun <tool>` where a `bunx` call is needed.

[run]
# Execute `node_modules/.bin/*` scripts on Bun's runtime, not Node's.
bun = true

[install]
# Exact versions for reproducible builds. A caret range is a promise that a
# future install may pull a different version, which makes "works on my
# machine" a question rather than an answer.
exact = true
# Faster installs
concurrentScripts = 16
# Refuse to install a package published less than an hour ago. The dependency
# tree is pinned to exact versions, so this only ever blocks a *new* version
# — the window in which a compromised publish would otherwise be picked up.
minimumReleaseAge = 3600
#
# The linker is deliberately left at Bun's default ("hoisted"). Bun's
# "isolated" linker is faster and stops phantom dependencies, but it is not
# compatible with the Next.js app in `crates/web`: Turbopack fails to resolve
# even direct dependencies from a symlinked node_modules tree. Stay on the
# hoisted linker until Turbopack supports the isolated layout.

[install.lockfile]
# Keep the lockfile in sync with package.json on every install. A lockfile
# that only CI regenerates is a lockfile nobody reviews.
save = true
