[package]
name = "foodshare-quadlet"
version = "1.0.0"
edition = "2024"
authors = ["Foodshare Team <engineering@foodshare.club>"]
license = "MIT"
description = "Quadlet validation and hygiene for Podman GitHub runners"
keywords = ["quadlet", "podman", "github-runners"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
handlebars = "5.1"

[dev-dependencies]
insta = "1.34"