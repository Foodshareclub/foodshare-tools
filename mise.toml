# Bun stable 1.4.4 is pinned across local tooling, manifests and CI.
# Use mise's native Bun backend; no npm bootstrap is required.
[tools]
bun = "1.4.4"
deno = "2.9.6"
# The WebAssembly modules are committed to the web repository, so the tool
# that shapes them is pinned. A different `wasm-pack` emits a different
# loader, and the difference looks like work rather than like a version
# change. `fs-wasm` checks this before it builds.
"cargo:wasm-pack" = "0.13.1"
