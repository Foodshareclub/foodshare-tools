[package]
name = "fs-orchestrator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP front-end for the Foodshare workspace orchestrator"
keywords = ["orchestration", "http", "daemon", "foodshare"]
categories = ["development-tools::build-utils"]

[[bin]]
name = "fs-orchestrator"
path = "src/main.rs"

[dependencies]
foodshare-orchestrator.workspace = true
foodshare-core.workspace = true
foodshare-telemetry.workspace = true
axum = { workspace = true, features = ["json", "http1", "tokio", "query"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = [
  "trace",
  "timeout",
  "request-id",
  "catch-panic",
] }
tokio = { workspace = true, features = ["signal"] }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tower = { workspace = true, features = ["util"] }
