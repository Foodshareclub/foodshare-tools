name: Daily Compatibility & E2E

# Nightly cross-repo compatibility orchestrator (tools hosts the shared
# compat-check script + ai-review action). Cargo lint/test/build coverage
# already runs daily via ci.yml (06:00 UTC) including the MSRV 1.88 gate.
#
# This workflow:
# 1. Runs clippy (advisory lint layer beyond ci.yml's check/test)
# 2. Cross-repo compatibility matrix: vendored supabase drift between web and
#    backend, production health endpoints, latest CI conclusions for all repos
# 3. AI review of last 24h of tooling commits
# 4. Stable-tsc divergence canary: the STABLE typescript@7.0.2 compiler over
#    both TS surfaces (root scripts + the crates/web Next.js app), one job
#    per surface, so a soundness bug in the tsrs dev build can never
#    silently redefine "clean"

on:
  schedule:
    - cron: "20 5 * * *" # 05:20 UTC daily (after per-repo daily-compat runs)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clippy:
    name: Clippy (workspace)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap tools (idempotent)
        run: |
          # Self-hosted runners must survive GitHub billing outages, so
          # nightly jobs provision their own toolchain if missing.
          command -v jq >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq jq curl; }
          command -v deno >/dev/null 2>&1 || { curl -fsSL https://deno.land/install.sh | DENO_INSTALL=/opt/deno sh -s -- -y; echo "/opt/deno/bin" >> "$GITHUB_PATH"; } || true
          command -v bun >/dev/null 2>&1 || { curl -fsSL https://bun.sh/install | BUN_INSTALL=/opt/bun bash >/dev/null; echo "/opt/bun/bin" >> "$GITHUB_PATH"; } || true
          command -v cargo >/dev/null 2>&1 || { [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env" && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; } || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious
        # mirrors ci.yml Lint gate; pedantic doc-lint debt tracked there

  compat-matrix:
    name: Compatibility matrix (all repos)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Foodshareclub/foodshare-backend
          path: .compat/backend
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: Foodshareclub/foodshare-web
          path: .compat/web
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Setup Bun for compatibility checks
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Run compat checks
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          # TODO: remove once org GitHub Actions billing is fixed
          IGNORE_CI_FAIL: Foodshareclub/foodshare-app Foodshareclub/foodshare-tools
          WEB_DIR: .compat/web
          BACKEND_DIR: .compat/backend
        run: bash scripts/compat-check.sh

  ai-review:
    name: AI review (24h commits)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ai-review
        with:
          mode: review
          since: "24 hours"

  tsc-cross-check:
    name: tsc cross-check (divergence canary, root)
    # tsrs is the only type checker in this pipeline, and it is a DEV
    # prerelease of the TypeScript 7 compiler lineage. A soundness bug in
    # the dev build would be invisible here. This job runs the STABLE
    # typescript@7.0.2 compiler (pinned in package.json) over the root
    # tsconfig (scripts/, types/, *.ts) every night: any divergence between
    # the two compilers turns this job red, so the dev build can never
    # silently redefine "clean". The Next.js app under crates/web has its
    # own canary — tsc-cross-check-web below — because it is a standalone
    # surface with its own lockfile and tsconfig.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check with stable tsc
        run: bun run type-check:tsc

  tsc-cross-check-web:
    name: tsc cross-check (divergence canary, crates/web)
    # The same canary as tsc-cross-check above, for the standalone Next.js
    # app under crates/web: its own package.json (typescript@7.0.2 pinned),
    # its own lockfile, and its own tsconfig, which includes the .next/types
    # route types — so the script runs `next typegen` first, mirroring the
    # per-push type-check job in ci.yml. Install happens INSIDE crates/web:
    # it is not a member of the root workspace.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: crates/web
      - name: Type-check with stable tsc
        run: bun run type-check:tsc
        working-directory: crates/web
