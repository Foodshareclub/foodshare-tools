name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The canary channel, pinned to an exact build so a CI run and a local run
  # execute the same binary.
  #
  # NOTE: `setup-bun` downloads from the GitHub releases, and the canary
  # builds are published to npm — there is no `bun-v<canary>` release for
  # them. Asking it for an exact canary version is a 404; the only canary
  # it can install is the rolling `canary` release, which is where the npm
  # canary comes from. So the workflow names `canary` and the exact build
  # stays pinned in mise.toml and package.json, which is what a developer
  # runs.
  BUN_VERSION: "canary"
  # NOTE: no global RUSTFLAGS="-D warnings" — it escalates every pedantic
  # clippy warning to a hard error and breaks plain cargo check/build.
  # Lint enforcement lives in the Lint job's scoped clippy deny-list.

concurrency:
  # The event name is in the group because Dependabot's own
  # `dependabot-updates` workflow re-runs this definition on the base
  # branch. With the group keyed only on the workflow and the ref, that
  # housekeeping run and a real push of the same commit shared a group,
  # and `cancel-in-progress` made one of them cancel the other — the
  # push run died with a cancelled job, with no steps run at all, and
  # the failure said nothing about the code.
  #
  # The push run is the authoritative one for a commit, so the two must
  # not share a group. Two pushes to the same branch still cancel each
  # other, which is the point of `cancel-in-progress`.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Toolchain guard
    # Bun is the only runtime for this project's own code. The guard fails the
    # build if Node creeps back in, or if Deno spreads past the edge functions
    # it is allowed in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: The Bun build is the canary
        # The rolling canary release must still be the build the repository
        # pins. A newer canary is fine — that is the point of a canary — but
        # a release build is not, because the toolchain is written against
        # the canary.
        #
        # `bun --version` drops the canary suffix and answers `1.4.4` for a
        # canary build; `bun --revision` keeps it.
        run: |
          case "$(bun --revision)" in
            *-canary*) ;;
            *) echo "expected a canary build, got $(bun --revision)"; exit 1 ;;
          esac
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: No Node.js in the toolchain
        run: bun run check:no-node
      - name: The guard and the type declarations agree
        # The guard rewrites a Node builtin to its `bun:` spelling, and
        # the type check rejects a spelling the declarations do not
        # cover. The two files are copies that drift, and nothing
        # noticed: the guard grew a mapping, the declarations did not, and
        # the next file that used it did not compile.
        run: bun run check:bun-modules
      - name: Type-check with tsrs
        run: bun run type-check
      - name: Lint the scripts
        # The `lint` job below is Rust's: `cargo fmt` and `cargo clippy`. The
        # ten TypeScript files at the root of this repository -- the CLI, the
        # scripts, the runners -- were linted by the pre-commit hook and by
        # nothing else, so a lint error in them could only ever be found by
        # the person who wrote it, and only if they had the hook installed.
        run: bun run lint
      - name: The workflow files are valid YAML
        # The same check the pre-commit hook runs, over every workflow
        # rather than over the staged ones. A workflow that does not parse
        # is a workflow that does not run, and nothing else here would say
        # so.
        run: bun run check:yaml

  web:
    name: The web app
    # The Next.js application under `crates/web` has its own toolchain, its
    # own lockfile and its own checks. Nothing ran them: the toolchain job
    # above checks the Rust workspace and the scripts at the root, and the
    # application was checked by nobody at all.
    #
    # The first thing that check found was a Sentry configuration written
    # against an API that had been renamed, importing a name that no longer
    # existed -- the browser would have thrown on it the first time it ran.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: crates/web
      - name: Type-check with tsrs
        run: bun run type-check
        working-directory: crates/web
      - name: Lint
        run: bun run lint
        working-directory: crates/web
      - name: Test
        run: bun run test
        working-directory: crates/web
      - name: Build
        # The application is the one thing here that is a deployable
        # artifact, and the build is the only check that sees it whole: a
        # prerender that refuses an unstable value, a route whose types
        # never resolve, a page that cannot be rendered at all. The type
        # check above cannot see any of that -- it reads the sources, and
        # the build reads the sources *and* renders them.
        run: bun run build
        working-directory: crates/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # The type check is `tsrs`, and it ran above. The build does not
          # type-check a second time with a second compiler: there is no
          # second compiler here.
          SKIP_BUILD_TYPECHECK: "true"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious
        # TODO(debt): crates/core enables clippy::pedantic but ~150
        # doc-lint violations remain (missing_errors_doc etc.). Burn them
        # down, then tighten this gate to plain `-D warnings`.

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit
      - run: cargo audit

  test:
    name: Test (${{ matrix.os }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  coverage:
    name: Coverage
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info

  build:
    name: Build (${{ matrix.target }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --workspace --target ${{ matrix.target }}

      # The daemon serves HTTP for the life of the process, so it is built
      # with the unwinding profile: under `panic = "abort"` one bad
      # request would take the process down.
      - name: Build the daemon
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --profile release-service --bin fs-orchestrator --target ${{ matrix.target }}

      # A binary that cannot print its own help is broken, and the
      # artefacts are published without anyone running them. Every binary
      # that ships is started here, on every runner that can run it.
      #
      # The cross-compiled target cannot: the runner is not that
      # architecture.
      - name: The binaries start
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: |
          for bin in fs-app fs-auto fs-build fs-image fs-maestro fs-sim \
                     fs-tui fs-verify fs-wasm fs-xccloud \
                     foodshare-i18n foodshare-quadlet foodshare-swift \
                     lefthook-rs; do
            printf '%-20s' "$bin"
            ./target/${{ matrix.target }}/release/$bin --help > /dev/null
            echo "ok"
          done
          printf '%-20s' "fs-orchestrator"
          ./target/${{ matrix.target }}/release-service/fs-orchestrator --help > /dev/null
          echo "ok"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/fs-app
            target/${{ matrix.target }}/release/lefthook-rs
            target/${{ matrix.target }}/release/fs-image
            target/${{ matrix.target }}/release/foodshare-i18n
            target/${{ matrix.target }}/release/foodshare-swift
            target/${{ matrix.target }}/release/foodshare-quadlet
            target/${{ matrix.target }}/release/fs-auto
            target/${{ matrix.target }}/release/fs-tui
            target/${{ matrix.target }}/release/fs-maestro
            target/${{ matrix.target }}/release/fs-wasm
            target/${{ matrix.target }}/release/fs-build
            target/${{ matrix.target }}/release/fs-sim
            target/${{ matrix.target }}/release/fs-xccloud
            target/${{ matrix.target }}/release/fs-verify
            target/${{ matrix.target }}/release-service/fs-orchestrator

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

      # The CLI reference is generated from the binaries' own help, so it
      # cannot describe a command that does not exist. This fails when it
      # has fallen behind the code.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the binaries
        run: cargo build --release --workspace
      - name: The CLI reference is up to date
        run: bun scripts/generate-cli-reference.ts --check

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace
